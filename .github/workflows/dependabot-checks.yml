name: Dependabot checks

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: dependabot-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    # Only dependabot authors run the gate; human PRs show a Skipped row, not
    # a success — never add this job to required branch-protection checks.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      DEVELOPMENT_TEAM: ""
      SIM: generic/platform=iOS Simulator
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode 27
        run: |
          set -euo pipefail
          for app in /Applications/Xcode*.app; do
            if [[ "$("$app/Contents/Developer/usr/bin/xcodebuild" -version 2>/dev/null | sed -n '1p')" == "Xcode 27."* ]]; then
              echo "Selecting $app"
              sudo xcode-select -s "$app/Contents/Developer"
              exit 0
            fi
          done
          echo "No Xcode 27.x found. Available Xcode bundles:" >&2
          ls -d /Applications/Xcode*.app >&2 || true
          exit 1

      - name: Guard Xcode 27 and macOS 27 SDK
        run: |
          set -euo pipefail
          # `sed -n '1p'` reads to EOF; `head -1` closes the pipe early, and
          # xcodebuild aborts on the resulting SIGPIPE/NSFileHandle exception
          # (observed on the xcode-27 runner), failing the step under pipefail.
          xcode_version="$(xcodebuild -version | sed -n '1p')"
          printf '%s\n' "$xcode_version"
          [[ "$xcode_version" == "Xcode 27."* ]] \
            || { echo "expected Xcode 27.x" >&2; exit 1; }
          sdk_version="$(xcrun --sdk macosx --show-sdk-version)"
          echo "macOS SDK version: $sdk_version"
          [[ "$sdk_version" == 27.* ]] \
            || { echo "expected macOS 27 SDK, got: $sdk_version" >&2; exit 1; }

      - name: Build (iOS Simulator)
        run: make build

      - name: Unit tests (macOS host)
        run: make test-unit

      - name: Build (macOS, unsigned)
        run: make build-mac

      - name: Build (watchOS Simulator)
        run: make watch-build

      - name: Shell suite
        run: bash scripts/tests/run.sh

      # Install before the lint step rather than after the shell suite so a
      # slow/failing Homebrew fetch surfaces early in the run.
      - name: Install shellcheck
        run: brew install shellcheck

      - name: Lint (shellcheck)
        run: shellcheck scripts/*.sh scripts/tests/*.sh
